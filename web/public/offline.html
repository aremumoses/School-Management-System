<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline — School Management System</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f8fafc;
      color: #1e1b4b;
      padding: 24px;
      text-align: center;
    }
    .card { max-width: 380px; }
    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 9999px;
      background: #eef2ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    h1 { font-size: 1.125rem; margin: 0 0 8px; }
    p { font-size: 0.875rem; color: #52525b; margin: 0 0 20px; line-height: 1.5; }
    button {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>
      No internet connection right now. Attendance and score entries you make
      will be queued and sent automatically once you're back online.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
