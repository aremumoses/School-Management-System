# Render Blueprint for the NestJS API + its Redis (Key Value) instance.
#
# The Next.js frontend is NOT here — it deploys to Vercel, whose free tier
# suits Next.js far better than a Render web service would.
#
# Postgres is NOT here either, deliberately: Render's free Postgres is deleted
# 30 days after creation, which would silently kill the demo. DATABASE_URL
# points at a Neon free database instead, which has no such expiry.
#
# To use: Render Dashboard -> New -> Blueprint -> pick this repo. Every var
# marked `sync: false` is prompted for at deploy time (nothing secret is
# committed here); the rest are set automatically.
services:
  - name: sms-api
    type: web
    runtime: docker
    plan: free
    rootDir: api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000

      # --- Managed by this blueprint ---
      # Redis reached over Render's private network, so the Key Value instance
      # needs no public exposure (see ipAllowList: [] below). This is also the
      # reason Render Key Value is used rather than Upstash: the app's config
      # accepts only REDIS_HOST/REDIS_PORT, with no field for the password or
      # TLS that every public managed Redis requires.
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: sms-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: sms-redis
          property: port

      # Generated by Render, never seen by anyone. Access and refresh secrets
      # must differ (see env.validation.ts) — two separate generateValue keys
      # produce two independent values.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # --- Prompted at deploy time ---
      - key: DATABASE_URL          # Neon connection string
        sync: false
      - key: FRONTEND_ORIGIN       # https://<your-app>.vercel.app — CORS origin
        sync: false

      # Supabase Storage, S3-compatible
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_PUBLIC_URL_BASE
        sync: false
      # Must match the Supabase project's real region: the S3 protocol signs
        # every request with it, so a wrong value fails auth even when the key
        # and secret are perfectly correct.
      - key: STORAGE_REGION
        value: eu-west-1
      - key: STORAGE_FORCE_PATH_STYLE
        value: "true"

      # Web Push works for real off a self-generated keypair — no account
      # needed — so unlike the providers below these are not placeholders.
      # VAPID_PUBLIC_KEY must be byte-identical to the frontend's
      # NEXT_PUBLIC_VAPID_PUBLIC_KEY or every subscription is rejected.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@demoschool.ng

      # Third-party providers. env.validation.ts requires these to be non-empty
      # so a misconfigured deploy fails loudly at boot, but the services
      # degrade gracefully on a bad key (an SMS records FAILED rather than
      # crashing), so placeholders are the right call for a public demo: no
      # tester can spend real money or send real messages to real people.
      - key: PAYSTACK_SECRET_KEY
        value: sk_test_placeholder-not-a-real-key
      - key: TERMII_API_KEY
        value: placeholder-not-a-real-key
      - key: RESEND_API_KEY
        value: placeholder-not-a-real-key
      - key: WHATSAPP_API_KEY
        value: placeholder-not-a-real-key
      - key: ANTHROPIC_API_KEY
        value: placeholder-not-a-real-key

  - name: sms-redis
    type: keyvalue
    plan: free
    # Empty list = block all external connections. The API reaches it over
    # Render's private network, so nothing outside needs in.
    ipAllowList: []
